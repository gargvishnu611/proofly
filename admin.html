<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e1116"><title>Proofly Admin Console</title><style>:root{--bg:#0e1116;--card:#151a21;--card2:#1b212b;--line:#2a3240;--text:#eef1f5;--muted:#9aa4b5;--gold:#d5ab57;--red:#ee6268;--green:#55cf70;--blue:#72a9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px 18px}.top{position:sticky;top:0;z-index:5;background:#0e1116ee;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.nav{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:13px 18px}.brand{font:700 22px Georgia;color:var(--gold)}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--text);padding:10px 13px;font-weight:700}.btn.primary{background:var(--gold);color:#171207;border-color:var(--gold)}.btn.danger{color:var(--red);border-color:#633039;background:transparent}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:14px}.four{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 12px;border-radius:8px}.tab.on{background:#242c37;color:var(--gold);border-color:#4a586d}.stat{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px}.num{font:700 28px Georgia}.muted{color:var(--muted)}.field{margin:0 0 12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}.field textarea{min-height:90px}.row{display:flex;gap:9px;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#26303d}.high{color:#ff858b;background:#4b1f25}.open{color:#f1b15d;background:#46301c}.ok{color:#68dd80;background:#183a24}.lock{color:#72a9ff;background:#1e3048}.notice{border-left:3px solid var(--gold);background:var(--card);padding:12px;border-radius:8px;color:var(--muted);margin:10px 0}.notice.red{border-left-color:var(--red)}.notice.green{border-left-color:var(--green)}.list{display:grid;gap:8px}.item{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:12px}.right{float:right}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center;padding:20px}.modalbox{width:min(620px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:850px){.four,.two{grid-template-columns:1fr 1fr}}@media(max-width:560px){.four,.two{grid-template-columns:1fr}.wrap{padding:18px 12px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="nav"><div class="brand">Proofly Admin</div><div class="actions"><button class="btn" id="setupBtn">Backend setup</button><button class="btn danger" id="signOutBtn">Sign out</button></div></div></header><main class="wrap"><section id="gate" class="card"><h1>Admin Console</h1><p class="muted">Admin access is enforced by Supabase Auth + the protected <span class="brand">admin_roles</span> table. This page does not trust a hidden button as security.</p><div id="gateMsg" class="notice">Checking your account…</div><div id="loginBox" class="hidden"><div class="grid two"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div></div><button class="btn primary" id="loginBtn">Sign in</button><button class="btn" id="demoBtn">View read-only demo</button></div></section><section id="panel" class="hidden"><div class="four" id="stats"></div><div class="tabs"><button class="tab on" data-tab="reports">Fraud reports</button><button class="tab" data-tab="risk">Risk intelligence</button><button class="tab" data-tab="flags">User flags</button><button class="tab" data-tab="audit">Audit log</button><button class="tab" data-tab="search">Search</button></div><div id="content"></div></section></main><div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div><script>const CFGKEY='proofly_supabase_config_v1';let client=null,user=null,role=null,tab='reports',demo=false;const cfg=()=>{try{return JSON.parse(localStorage.getItem(CFGKEY)||'{}')}catch(e){return {}}};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const toast=m=>{const d=document.createElement('div');d.className='notice green';d.style.position='fixed';d.style.right='15px';d.style.bottom='15px';d.style.zIndex=99;d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)};function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}document.getElementById('closeSetup')?.addEventListener('click',closeModal);function openSetup(){const c=cfg();openModal('<h2>Supabase setup</h2><p class="muted">Use the Project URL and public anon/publishable key only. Never paste a service-role key here.</p><div class="field"><label>Project URL</label><input id="surl" value="'+esc(c.supabaseUrl||'')+'" placeholder="https://project.supabase.co"></div><div class="field"><label>Anon / publishable key</label><textarea id="skey">'+esc(c.supabaseAnonKey||'')+'</textarea></div><div class="actions"><button class="btn primary" onclick="saveSetup()">Save & reload</button><button class="btn" onclick="closeModal()">Cancel</button></div>')}function saveSetup(){const url=document.getElementById('surl').value.trim(),key=document.getElementById('skey').value.trim();if(!url||!key)return toast('Both values are required');localStorage.setItem(CFGKEY,JSON.stringify({supabaseUrl:url,supabaseAnonKey:key}));location.reload()}async function init(){const c=cfg();if(c.supabaseUrl&&c.supabaseAnonKey&&window.supabase){try{client=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});const s=await client.auth.getSession();user=s.data?.session?.user||null;if(user){const q=await client.from('admin_roles').select('role').eq('user_id',user.id).maybeSingle();role=q.data?.role||null}renderGate()}else renderGate()}else renderGate()}function renderGate(){document.getElementById('signOutBtn').style.display=user?'inline-block':'none';if(demo){document.getElementById('gateMsg').innerHTML='<span class="badge lock">READ-ONLY DEMO</span><br><span class="muted">No real records are loaded in demo mode.</span>';document.getElementById('panel').classList.remove('hidden');loadDemo();return}if(!user){document.getElementById('gateMsg').innerHTML='<span class="notice red">Not signed in. Sign in with a Supabase account that has an admin/staff role.</span>';document.getElementById('loginBox').classList.remove('hidden');document.getElementById('panel').classList.add('hidden');return}if(!role){document.getElementById('gateMsg').innerHTML='<span class="notice red">Access denied. Your account has no admin/staff role.</span>';document.getElementById('loginBox').classList.add('hidden');return}document.getElementById('gateMsg').innerHTML='<span class="badge ok">AUTHORIZED</span> Role: <b>'+esc(role)+'</b>';document.getElementById('panel').classList.remove('hidden');loadAll()}document.getElementById('loginBtn').addEventListener('click',async()=>{const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!client)return toast('Configure Supabase first');if(!e||!p)return toast('Email and password required');const r=await client.auth.signInWithPassword({email:e,password:p});if(r.error)return toast(r.error.message);user=r.data.user;const q=await client.from('admin_roles').select('role').eq('user_id',user.id).maybeSingle();role=q.data?.role||null;renderGate()});document.getElementById('demoBtn').addEventListener('click',()=>{demo=true;renderGate()});document.getElementById('signOutBtn').addEventListener('click',async()=>{if(client)await client.auth.signOut();user=null;role=null;demo=false;renderGate()});document.getElementById('setupBtn').addEventListener('click',openSetup);async function staffQuery(table,opts={}){if(!client)throw Error('Supabase is not configured');let q=client.from(table);if(opts.select)q=q.select(opts.select);else q=q.select('*');if(opts.order)q=q.order(opts.order,{ascending:false});if(opts.filter)q=q.eq(opts.filter[0],opts.filter[1]);return q}async function log(action,targetType,targetId,metadata={}){if(!client||!user||!role)return;await client.from('admin_audit_logs').insert({admin_id:user.id,action,target_type:targetType,target_id:targetId,metadata})}async function loadAll(){await Promise.all([loadStats(),loadReports(),loadRisk(),loadFlags(),loadAudit()])}async function loadStats(){const s=document.getElementById('stats');if(demo){s.innerHTML='<div class="stat"><div class="num">3</div><div class="muted">Sample reports</div></div><div class="stat"><div class="num">2</div><div class="muted">Risk signals</div></div><div class="stat"><div class="num">1</div><div class="muted">Open flag</div></div><div class="stat"><div class="num">7</div><div class="muted">Audit events</div></div>';return}const rs=await staffQuery('fraud_reports');const rk=await staffQuery('risk_entities');const fl=await staffQuery('user_flags');const au=await staffQuery('admin_audit_logs');s.innerHTML=[['Reports',rs.data?.length||0],['Risk signals',rk.data?.length||0],['Open flags',fl.data?.filter(x=>x.status==='open').length||0],['Audit events',au.data?.length||0]].map(x=>'<div class="stat"><div class="num">'+x[1]+'</div><div class="muted">'+x[0]+'</div></div>').join('')}async function loadReports(){if(tab!=='reports')return;const d=document.getElementById('content');if(demo){d.innerHTML='<div class="card"><h2>Fraud reports</h2><div class="item"><b>CASE-DEMO01</b><br><span class="muted">@demo_suspect · Telegram · high priority · submitted</span><div class="actions"><button class="btn small">Review</button><button class="btn small">Resolve</button></div></div></div>';return}const q=await staffQuery('fraud_reports',{order:'created_at'});d.innerHTML='<div class="card"><div class="row"><h2>Fraud reports</h2><button class="btn small" onclick="loadAll()">Refresh</button></div>'+(q.data?.length?q.data.map(r=>'<div class="item"><b>'+esc(r.id)+'</b> <span class="badge '+(r.priority==='critical'||r.priority==='high'?'high':'open')+'">'+esc(r.status)+'</span><br><span class="muted">'+esc(r.identifier||'—')+' · '+esc(r.platform||'—')+' · '+esc(r.priority)+'</span><p>'+esc(r.description)+'</p><div class="actions"><button class="btn small" onclick="setReport(\''+r.id+'\',\'under_review\')">Review</button><button class="btn small" onclick="setReport(\''+r.id+'\',\'resolved\')">Resolve</button></div></div>').join(''):'<div class="muted">No reports.</div>')+'</div>'}async function setReport(id,status){if(demo)return;if(!client)return;const r=await client.from('fraud_reports').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);await log('update-fraud-report','fraud_report',id,{status});toast('Report updated');loadAll()}async function loadRisk(){if(tab!=='risk')return;const d=document.getElementById('content');if(demo){d.innerHTML='<div class="card"><h2>Risk intelligence</h2><div class="item">@demo_suspect · Telegram · <span class="badge high">high</span><p class="muted">Sample repeated reports.</p></div></div>';return}const q=await staffQuery('risk_entities',{order:'created_at'});d.innerHTML='<div class="card"><div class="row"><h2>Risk intelligence</h2><button class="btn primary small" onclick="newRisk()">Add signal</button></div>'+(q.data?.length?q.data.map(r=>'<div class="item"><b>'+esc(r.identifier)+'</b> <span class="badge '+(r.severity==='high'?'high':'open')+'">'+esc(r.severity)+'</span><p>'+esc(r.title)+' — '+esc(r.detail||'')+'</p></div>').join(''):'<div class="muted">No signals.</div>')+'</div>'}function newRisk(){if(demo)return;openModal('<h2>Add risk signal</h2><div class="field"><label>Identifier</label><input id="ri"></div><div class="field"><label>Platform</label><select id="rp"><option>Telegram</option><option>UPI</option><option>Website</option><option>Phone</option><option>Other</option></select></div><div class="field"><label>Severity</label><select id="rs"><option>suspicious</option><option>high</option><option>limited</option></select></div><div class="field"><label>Title</label><input id="rt"></div><div class="field"><label>Detail</label><textarea id="rd"></textarea></div><div class="actions"><button class="btn primary" onclick="saveRisk()">Save signal</button><button class="btn" onclick="closeModal()">Cancel</button></div>')}async function saveRisk(){const identifier=document.getElementById('ri').value.trim();if(!identifier)return toast('Identifier required');const r=await client.from('risk_entities').insert({identifier,normalized_identifier:identifier.toLowerCase(),platform:document.getElementById('rp').value,severity:document.getElementById('rs').value,title:document.getElementById('rt').value.trim()||'Staff-created risk signal',detail:document.getElementById('rd').value.trim(),source:'staff'});if(r.error)return toast(r.error.message);await log('create-risk-signal','risk_entity',identifier);closeModal();toast('Risk signal saved');loadAll()}async function loadFlags(){if(tab!=='flags')return;const d=document.getElementById('content');if(demo){d.innerHTML='<div class="card"><h2>User flags</h2><div class="item">demo-user · <span class="badge high">high</span> · open<button class="btn small right">Resolve</button></div></div>';return}const q=await staffQuery('user_flags',{order:'created_at'});d.innerHTML='<div class="card"><div class="row"><h2>User flags</h2><button class="btn small" onclick="loadAll()">Refresh</button></div>'+(q.data?.length?q.data.map(f=>'<div class="item"><b>'+esc(f.user_id)+'</b> <span class="badge '+(f.severity==='high'||f.severity==='critical'?'high':'open')+'">'+esc(f.severity)+'</span><p>'+esc(f.reason)+' · '+esc(f.status)+'</p>'+(f.status==='open'?'<button class="btn small" onclick="resolveFlag(\''+f.id+'\')">Resolve</button>':'')+'</div>').join(''):'<div class="muted">No flags.</div>')+'</div>'}async function resolveFlag(id){if(demo)return;const r=await client.from('user_flags').update({status:'resolved',resolved_at:new Date().toISOString()}).eq('id',id);if(r.error)return toast(r.error.message);await log('resolve-user-flag','user_flag',id);toast('Flag resolved');loadAll()}async function loadAudit(){if(tab!=='audit')return;const d=document.getElementById('content');if(demo){d.innerHTML='<div class="card"><h2>Audit log</h2><div class="item">14:32 · admin · reviewed fraud report</div><div class="item">14:11 · admin · added risk signal</div></div>';return}const q=await staffQuery('admin_audit_logs',{order:'created_at'});d.innerHTML='<div class="card"><div class="row"><h2>Audit log</h2><button class="btn small" onclick="loadAll()">Refresh</button></div>'+(q.data?.length?q.data.map(a=>'<div class="item"><b>'+esc(a.action)+'</b><br><span class="muted">'+esc(a.target_type||'')+' '+esc(a.target_id||'')+' · '+new Date(a.created_at).toLocaleString()+'</span></div>').join(''):'<div class="muted">No audit entries.</div>')+'</div>'}function loadSearch(){const d=document.getElementById('content');d.innerHTML='<div class="card"><h2>Search</h2><div class="field"><label>Identifier / Proof ID / Case ID</label><input id="sq"></div><button class="btn primary" onclick="doSearch()">Search</button><div id="sr" style="margin-top:12px"></div></div>'}async function doSearch(){const v=document.getElementById('sq').value.trim();if(!v)return toast('Enter a search term');if(demo){document.getElementById('sr').innerHTML='<div class="notice">Demo search is read-only.</div>';return}const [r1,r2]=await Promise.all([client.from('fraud_reports').select('*').ilike('identifier','%'+v+'%'),client.from('risk_entities').select('*').ilike('identifier','%'+v+'%')]);document.getElementById('sr').innerHTML='<div class="item"><b>Fraud reports</b><br>'+esc(JSON.stringify(r1.data||[]))+'</div><div class="item"><b>Risk signals</b><br>'+esc(JSON.stringify(r2.data||[]))+'</div>'}function loadDemo(){loadStats();tab='reports';loadReports()}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;if(tab==='search')loadSearch();else if(tab==='reports')loadReports();else if(tab==='risk')loadRisk();else if(tab==='flags')loadFlags();else if(tab==='audit')loadAudit()}));init();</script></body></html>
