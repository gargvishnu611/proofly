name: Deploy Proofly to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          cp -R . site/ --exclude=site --exclude=.git --exclude=.github --exclude=node_modules
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'href="admin.html"'
          if marker not in s:
              link = '<a class="btn secondary small" href="admin.html" style="margin:14px 20px;display:inline-flex">Admin Console</a>'
              s = s.replace('</main>', '<div class="container">'+link+'</div></main>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
